<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>That's My Naga</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0e0e0e;
      --surface:  #191919;
      --surface2: #242424;
      --border:   #2e2e2e;
      --accent:   #c9a84c;
      --accent2:  #e8c97a;
      --text:     #e8e2d9;
      --muted:    #6b6560;
      --danger:   #e05c5c;
      --success:  #4cb85c;
      --radius:   14px;
      --sidebar:  220px;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── AUTH ── */
    .auth-wrap {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 30%, #1e1a10 0%, var(--bg) 70%);
    }
    .auth-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 48px 40px; width: 380px;
      box-shadow: 0 40px 80px rgba(0,0,0,.6);
    }
    .auth-logo {
      font-family: 'Playfair Display', serif; font-size: 13px;
      letter-spacing: .18em; text-transform: uppercase;
      color: var(--accent); text-align: center; margin-bottom: 6px;
    }
    .auth-title {
      font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700;
      text-align: center; color: var(--text); margin-bottom: 32px;
    }
    .auth-tabs {
      display: flex; gap: 4px; background: var(--bg);
      border-radius: 10px; padding: 4px; margin-bottom: 28px;
    }
    .auth-tab {
      flex: 1; padding: 9px; border-radius: 7px; border: none;
      font-family: 'DM Sans', sans-serif; font-size: 13px;
      cursor: pointer; transition: all .2s; background: transparent; color: var(--muted);
    }
    .auth-tab.active { background: var(--surface2); color: var(--text); }
    .field-label {
      font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 7px;
    }
    .field-input {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 9px; padding: 12px 14px; color: var(--text);
      font-size: 14px; font-family: 'DM Sans', sans-serif;
      outline: none; transition: border-color .2s; margin-bottom: 18px;
    }
    .field-input:focus { border-color: var(--accent); }
    .field-input.err { border-color: var(--danger); margin-bottom: 4px; }
    .field-error { font-size: 11px; color: var(--danger); margin-bottom: 14px; }
    .btn-primary {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; border-radius: 10px; color: #1a1200;
      font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600;
      cursor: pointer; letter-spacing: .04em;
      transition: opacity .2s, transform .1s; margin-top: 4px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary:hover:not(:disabled) { opacity: .9; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

    .alert-error {
      background: rgba(224,92,92,.1); border: 1px solid rgba(224,92,92,.3);
      border-radius: 9px; padding: 10px 14px;
      font-size: 13px; color: var(--danger); margin-bottom: 16px;
    }

    /* ── SHELL ── */
    .app-shell { display: flex; height: 100vh; overflow: hidden; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: var(--sidebar); background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; padding: 28px 0; flex-shrink: 0;
    }
    .sidebar-brand {
      font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 700;
      color: var(--accent); padding: 0 22px 28px; border-bottom: 1px solid var(--border);
    }
    .sidebar-brand span { color: var(--text); }
    .nav-list { list-style: none; padding: 18px 12px; flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 14px; border-radius: 9px; cursor: pointer;
      color: var(--muted); font-size: 13.5px; transition: background .15s, color .15s;
    }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: rgba(201,168,76,.13); color: var(--accent); font-weight: 500; }
    .nav-icon { font-size: 15px; width: 20px; text-align: center; }
    .sidebar-footer { padding: 18px 12px 0; border-top: 1px solid var(--border); flex-shrink: 0; }
    .sidebar-credit {
      padding: 8px 14px 10px;
      font-size: 10px; color: var(--muted);
      line-height: 1.5;
    }
    .sidebar-credit strong { color: var(--accent); display: block; font-size: 11px; }

    /* ── MAIN ── */
    .main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .topbar {
      height: 62px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 28px; gap: 14px; flex-shrink: 0;
    }
    .topbar-title { font-family: 'Playfair Display', serif; font-size: 15px; color: var(--muted); }
    .search-box {
      margin-left: auto; display: flex; align-items: center;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 9px; padding: 0 14px; gap: 8px; height: 38px; width: 240px;
    }
    .search-box input {
      background: none; border: none; outline: none;
      color: var(--text); font-size: 13.5px; font-family: 'DM Sans', sans-serif; width: 100%;
    }
    .search-box input::placeholder { color: var(--muted); }
    .search-icon { color: var(--muted); }
    .page-content { flex: 1; overflow-y: auto; padding: 30px 32px; }
    .page-heading { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; margin-bottom: 24px; }

    /* ── STATES ── */
    .state-box {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 260px; gap: 12px; color: var(--muted);
    }
    .state-icon { font-size: 36px; }
    .state-title { font-family: 'Playfair Display', serif; font-size: 17px; color: var(--text); }
    .state-sub { font-size: 13px; }
    .spinner {
      width: 32px; height: 32px; border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-retry {
      padding: 9px 20px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-family: 'DM Sans', sans-serif;
      font-size: 13px; cursor: pointer; transition: border-color .2s;
    }
    .btn-retry:hover { border-color: var(--accent); }

    /* ── FEATURED ── */
    .featured-banner {
      border-radius: var(--radius);
      background: linear-gradient(135deg, #2a1f06 0%, #1a140a 60%, #0e0e0e 100%);
      border: 1px solid var(--border); height: 200px;
      display: flex; align-items: flex-end; padding: 22px 26px;
      margin-bottom: 30px; position: relative; overflow: hidden;
    }
    .featured-banner::before {
      content: ''; position: absolute; inset: 0;
      background: repeating-linear-gradient(45deg,transparent,transparent 40px,rgba(201,168,76,.03) 40px,rgba(201,168,76,.03) 41px);
    }
    .featured-cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .35; }
    .featured-content { position: relative; z-index: 1; }
    .featured-tag { font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
    .featured-name { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 600; }
    .featured-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .section-label { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; }

    /* ── GRID ── */
    .store-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin-bottom: 32px; }
    .store-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; cursor: pointer;
      transition: border-color .2s, transform .15s, box-shadow .2s;
      position: relative;
    }
    .store-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,.4); }
    .store-img { height: 110px; background: var(--surface2); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
    .store-img img { width: 100%; height: 100%; object-fit: cover; }
    .store-img-ph { font-size: 32px; color: var(--muted); }
    .store-info { padding: 12px 14px 14px; }
    .store-name { font-family: 'Playfair Display', serif; font-size: 14px; font-weight: 600; margin-bottom: 5px; }
    .store-desc { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
    .store-rating { margin-top: 8px; font-size: 11px; color: var(--accent); }
    .fav-btn {
      position: absolute; top: 8px; right: 8px; width: 32px; height: 32px;
      border-radius: 50%; background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.1);
      color: var(--muted); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all .2s; z-index: 2;
    }
    .fav-btn:hover { background: rgba(0,0,0,.8); transform: scale(1.1); }
    .fav-btn.active { color: var(--danger); }

    /* ── STORE DETAIL ── */
    .detail-hero {
      width: 100%; height: 260px; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; position: relative; margin-bottom: 28px;
      display: flex; align-items: center; justify-content: center;
    }
    .detail-hero img { width: 100%; height: 100%; object-fit: cover; }
    .detail-hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,.65));
      display: flex; align-items: flex-end; padding: 22px 26px;
    }
    .detail-hero-name { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-bottom: 28px; }
    .detail-block-title { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 700; margin-bottom: 10px; }
    .detail-block-text { font-size: 13px; color: var(--muted); line-height: 1.65; }
    .detail-meta { margin-top: 14px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
    .mini-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-top: 16px; }
    .mini-img {
      height: 70px; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: var(--muted);
    }
    .mini-img img { width: 100%; height: 100%; object-fit: cover; }
    .avg-rating { font-size: 32px; font-family: 'Playfair Display', serif; color: var(--accent); margin-bottom: 12px; }
    .review-list { display: flex; flex-direction: column; gap: 12px; }
    .review-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
    .review-author { font-size: 12px; color: var(--accent); font-weight: 500; margin-bottom: 4px; }
    .review-text { font-size: 12.5px; color: var(--muted); line-height: 1.5; }

    /* ── ADD FORM ── */
    .add-form { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
    .form-group { display: flex; flex-direction: column; gap: 7px; }
    .form-group.full { grid-column: 1 / -1; }
    .form-label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .form-input, .form-textarea, .form-select {
      background: var(--bg); border: 1px solid var(--border); border-radius: 9px;
      padding: 11px 14px; color: var(--text); font-size: 13.5px;
      font-family: 'DM Sans', sans-serif; outline: none; transition: border-color .2s;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--accent); }
    .form-input.err, .form-textarea.err, .form-select.err { border-color: var(--danger); }
    .form-error { font-size: 11px; color: var(--danger); }
    .form-textarea { resize: vertical; min-height: 90px; }
    .form-select { cursor: pointer; }
    .upload-box {
      border: 1.5px dashed var(--border); border-radius: 10px; height: 120px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; cursor: pointer; transition: border-color .2s; color: var(--muted); font-size: 13px;
    }
    .upload-box:hover { border-color: var(--accent); color: var(--accent); }
    .upload-icon { font-size: 28px; }
    .preview-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .preview-item { width: 80px; height: 80px; border-radius: 8px; border: 1px solid var(--border); overflow: hidden; position: relative; }
    .preview-item img { width: 100%; height: 100%; object-fit: cover; }
    .preview-remove {
      position: absolute; top: 4px; right: 4px; width: 18px; height: 18px;
      border-radius: 50%; background: rgba(0,0,0,.7); border: none; color: #fff;
      font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .form-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
    .btn-submit {
      padding: 12px 32px; background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; border-radius: 9px; color: #1a1200;
      font-family: 'DM Sans', sans-serif; font-size: 13.5px; font-weight: 600;
      cursor: pointer; letter-spacing: .04em; transition: opacity .2s, transform .1s;
      display: flex; align-items: center; gap: 8px;
    }
    .btn-submit:hover:not(:disabled) { opacity: .88; transform: translateY(-1px); }
    .btn-submit:disabled { opacity: .5; cursor: not-allowed; }
    .btn-cancel {
      padding: 12px 22px; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 9px; color: var(--muted); font-family: 'DM Sans', sans-serif;
      font-size: 13.5px; cursor: pointer; transition: border-color .2s, color .2s;
    }
    .btn-cancel:hover { border-color: var(--accent); color: var(--text); }
    .success-banner {
      background: rgba(76,184,92,.1); border: 1px solid rgba(76,184,92,.3);
      border-radius: 9px; padding: 12px 16px; font-size: 13px; color: #6dda7e; margin-bottom: 18px;
    }

    /* ── ADMIN PANEL ── */
    .admin-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px; text-align: center;
    }
    .stat-icon { font-size: 28px; margin-bottom: 8px; }
    .stat-value { font-family: 'Playfair Display', serif; font-size: 32px; color: var(--accent); }
    .stat-label { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .admin-section { margin-bottom: 32px; }
    .admin-section-title {
      font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 600;
      margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
    }
    .data-table {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
    }
    .data-table-header {
      display: grid; grid-template-columns: 50px 1fr 1fr 100px 150px 200px;
      padding: 12px 16px; background: var(--surface2);
      font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .data-table-row {
      display: grid; grid-template-columns: 50px 1fr 1fr 100px 150px 200px;
      padding: 12px 16px; align-items: center;
      border-bottom: 1px solid var(--border); font-size: 13px;
    }
    .data-table-row:last-child { border-bottom: none; }
    .role-badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: 10px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600;
    }
    .role-admin { background: rgba(201,168,76,.15); color: var(--accent); }
    .role-user { background: rgba(107,101,96,.15); color: var(--muted); }
    .btn-sm {
      padding: 6px 14px; border-radius: 6px; font-size: 12px; font-family: 'DM Sans', sans-serif;
      cursor: pointer; border: none; transition: opacity .2s;
    }
    .btn-view { background: rgba(201,168,76,.15); color: var(--accent); }
    .btn-edit { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-delete { background: rgba(224,92,92,.15); color: var(--danger); }
    .btn-sm:hover { opacity: .8; }
    .actions-cell { display: flex; gap: 6px; }

    /* ── RECOMMENDATION CARDS ── */
    .rec-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .rec-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
    }
    .rec-img { height: 140px; background: var(--surface2); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .rec-img img { width: 100%; height: 100%; object-fit: cover; }
    .rec-info { padding: 14px; }
    .rec-name { font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .rec-meta { font-size: 11px; color: var(--accent); margin-bottom: 8px; }
    .rec-reason { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .rec-detail { font-size: 11px; color: var(--muted); }
    .rec-actions { display: flex; gap: 8px; margin-top: 12px; }
    .rec-actions .btn-sm { flex: 1; text-align: center; }

    /* ── MISC ── */
    .back-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .btn-back {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 7px 13px; color: var(--text); cursor: pointer; font-size: 13px;
      font-family: 'DM Sans', sans-serif; transition: border-color .2s;
    }
    .btn-back:hover { border-color: var(--accent); }
    .badge {
      display: inline-block; padding: 3px 9px; border-radius: 20px;
      font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
      background: rgba(201,168,76,.12); color: var(--accent); border: 1px solid rgba(201,168,76,.2);
    }

    .fade-enter-active, .fade-leave-active { transition: opacity .18s ease; }
    .fade-enter-from, .fade-leave-to { opacity: 0; }

    /* ── STAR RATING ── */
    .star-rating { display: flex; gap: 4px; font-size: 28px; cursor: pointer; }
    .star-rating .star { color: var(--border); transition: color .15s; }
    .star-rating .star.filled { color: var(--accent); }
    .star-rating .star:hover { color: var(--accent2); }
    .star-rating.readonly { cursor: default; pointer-events: none; }
    .star-rating.readonly .star:hover { color: inherit; }

    /* ── REVIEW FORM ── */
    .review-form {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px; margin-bottom: 20px;
    }
    .review-form-title { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 600; margin-bottom: 14px; }
    .review-form-label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; display: block; }
    .review-textarea {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 9px; padding: 12px 14px; color: var(--text);
      font-size: 13.5px; font-family: 'DM Sans', sans-serif;
      outline: none; resize: vertical; min-height: 80px; margin-bottom: 14px;
    }
    .review-textarea:focus { border-color: var(--accent); }
    .review-submit {
      padding: 10px 24px; background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; border-radius: 9px; color: #1a1200;
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: opacity .2s;
    }
    .review-submit:hover { opacity: .88; }
    .review-submit:disabled { opacity: .4; cursor: not-allowed; }
    .review-error { font-size: 12px; color: var(--danger); margin-top: 8px; }
    .review-success { font-size: 12px; color: var(--success); margin-top: 8px; }

    /* ── REVIEW LIST ── */
    .review-item {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px 16px; margin-bottom: 10px;
    }
    .review-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .review-author { font-size: 13px; color: var(--accent); font-weight: 500; cursor: pointer; }
    .review-author:hover { text-decoration: underline; }
    .review-date { font-size: 11px; color: var(--muted); }
    .review-stars { font-size: 14px; margin-bottom: 6px; }
    .review-comment { font-size: 13px; color: var(--text); line-height: 1.5; }
    .review-actions { display: flex; gap: 8px; margin-top: 10px; }
    .review-actions button {
      padding: 4px 10px; border-radius: 6px; font-size: 11px;
      cursor: pointer; border: none; font-family: 'DM Sans', sans-serif;
      transition: opacity .15s;
    }
    .review-actions button:hover { opacity: .8; }
    .btn-edit-review { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-delete-review { background: rgba(224,92,92,.15); color: var(--danger); }

    .avg-rating-big {
      font-size: 42px; font-family: 'Playfair Display', serif; color: var(--accent); margin-bottom: 4px;
    }
    .avg-rating-stars { font-size: 20px; margin-bottom: 12px; }
    .total-reviews-text { font-size: 12px; color: var(--muted); margin-bottom: 20px; }

    /* ── NOTIFICATIONS ── */
    .notif-bell {
      position: relative; width: 36px; height: 36px; border-radius: 9px;
      background: var(--surface); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 16px; color: var(--muted);
      transition: border-color .2s, color .2s;
    }
    .notif-bell:hover { border-color: var(--accent); color: var(--accent); }
    .notif-badge {
      position: absolute; top: -2px; right: -2px;
      background: var(--danger); color: #fff; font-size: 10px;
      font-weight: 700; width: 16px; height: 16px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .notif-dropdown {
      position: absolute; top: 48px; right: 28px; width: 340px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: 0 20px 60px rgba(0,0,0,.5);
      z-index: 100; overflow: hidden;
    }
    .notif-header {
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .notif-header-title { font-family: 'Playfair Display', serif; font-size: 15px; }
    .notif-mark-all { font-size: 11px; color: var(--accent); cursor: pointer; }
    .notif-mark-all:hover { text-decoration: underline; }
    .notif-list { max-height: 320px; overflow-y: auto; }
    .notif-item {
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      cursor: pointer; transition: background .15s;
      display: flex; gap: 10px; align-items: flex-start;
    }
    .notif-item:hover { background: var(--surface2); }
    .notif-item.unread { border-left: 3px solid var(--accent); }
    .notif-dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
      flex-shrink: 0; margin-top: 4px;
    }
    .notif-content { flex: 1; }
    .notif-text { font-size: 12.5px; color: var(--text); line-height: 1.4; }
    .notif-time { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .notif-empty { padding: 24px; text-align: center; color: var(--muted); font-size: 13px; }

    /* ── USER DROPDOWN ── */
    .user-menu { position: relative; }
    .user-trigger {
      display: flex; align-items: center; gap: 8px; padding: 6px 12px;
      border-radius: 9px; cursor: pointer; transition: background .15s;
      border: 1px solid transparent;
    }
    .user-trigger:hover { background: var(--surface); border-color: var(--border); }
    .user-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: #1a1200;
    }
    .user-name { font-size: 13px; color: var(--text); }
    .user-dropdown {
      position: absolute; top: 44px; right: 0; width: 180px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
      z-index: 100; overflow: hidden;
    }
    .user-dropdown-item {
      padding: 10px 14px; font-size: 13px; color: var(--text);
      cursor: pointer; transition: background .15s;
      display: flex; align-items: center; gap: 8px;
    }
    .user-dropdown-item:hover { background: var(--surface2); }
    .user-dropdown-divider { height: 1px; background: var(--border); margin: 4px 0; }

    /* ── PROFILE PAGE ── */
    .profile-header {
      display: flex; align-items: center; gap: 20px; margin-bottom: 32px;
    }
    .profile-avatar-big {
      width: 80px; height: 80px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: 700; color: #1a1200;
      flex-shrink: 0;
    }
    .profile-info { flex: 1; }
    .profile-name { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; }
    .profile-username { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .profile-bio { font-size: 13px; color: var(--text); margin-top: 8px; line-height: 1.5; }
    .profile-stats { display: flex; gap: 24px; margin-top: 12px; }
    .profile-stat { text-align: center; }
    .profile-stat-value { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--accent); }
    .profile-stat-label { font-size: 11px; color: var(--muted); }
    .profile-section { margin-bottom: 28px; }
    .profile-section-title {
      font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 600;
      margin-bottom: 14px;
    }

    /* ── SETTINGS PAGE ── */
    .settings-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px; margin-bottom: 20px;
    }
    .settings-title { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 600; margin-bottom: 16px; }
    .settings-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0; border-bottom: 1px solid var(--border);
    }
    .settings-row:last-child { border-bottom: none; }
    .settings-label { font-size: 13px; color: var(--text); }
    .settings-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .toggle {
      width: 44px; height: 24px; border-radius: 12px; background: var(--border);
      position: relative; cursor: pointer; transition: background .2s;
      flex-shrink: 0;
    }
    .toggle.on { background: var(--accent); }
    .toggle-knob {
      position: absolute; top: 2px; left: 2px;
      width: 20px; height: 20px; border-radius: 50%;
      background: #fff; transition: transform .2s;
    }
    .toggle.on .toggle-knob { transform: translateX(20px); }

    /* ── MAP MODAL ── */
    .map-modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.7);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; padding: 20px;
    }
    .map-modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); width: 100%; max-width: 700px;
      overflow: hidden;
    }
    .map-modal-header {
      padding: 16px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .map-modal-title { font-family: 'Playfair Display', serif; font-size: 16px; }
    .map-modal-close {
      width: 28px; height: 28px; border-radius: 6px;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--muted); cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .map-modal-close:hover { border-color: var(--accent); color: var(--accent); }
    .map-container { height: 400px; width: 100%; }

    /* ── FILTER BAR ── */
    .filter-bar {
      display: flex; gap: 12px; align-items: center; margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .filter-select {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 12px; color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 13px;
      cursor: pointer; outline: none;
    }
    .filter-select:focus { border-color: var(--accent); }
    .sort-btn {
      padding: 8px 14px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; color: var(--muted); font-size: 12px;
      cursor: pointer; transition: all .15s;
    }
    .sort-btn:hover { border-color: var(--accent); color: var(--text); }
    .sort-btn.active { background: rgba(201,168,76,.13); color: var(--accent); border-color: var(--accent); }

    /* ── FAVORITES PAGE ── */
    .fav-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

    /* Leaflet dark mode overrides */
    .leaflet-container { background: var(--surface2); }
  </style>

<body>
<div id="app">

  <!-- ═══════ AUTH ═══════ -->
  <template v-if="!loggedIn">
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-logo">That's My Naga</div>
        <div class="auth-title">{{ authMode === 'login' ? 'Welcome Back' : 'Create Account' }}</div>
        <div class="auth-tabs">
          <button class="auth-tab" :class="{active: authMode==='login'}"    @click="switchAuth('login')">Sign In</button>
          <button class="auth-tab" :class="{active: authMode==='register'}" @click="switchAuth('register')">Register</button>
        </div>

        <div v-if="authError" class="alert-error">{{ authError }}</div>

        <template v-if="authMode==='register'">
          <div class="field-label">Full Name</div>
          <input class="field-input" :class="{err: fe.name}" type="text" placeholder="Enter full name" v-model="authForm.name"/>
          <div v-if="fe.name" class="field-error">{{ fe.name }}</div>
        </template>

        <div class="field-label">Username</div>
        <input class="field-input" :class="{err: fe.username}" type="text" placeholder="Enter username" v-model="authForm.username"/>
        <div v-if="fe.username" class="field-error">{{ fe.username }}</div>

        <div class="field-label">Password</div>
        <input class="field-input" :class="{err: fe.password}" type="password" placeholder="Enter password" v-model="authForm.password"/>
        <div v-if="fe.password" class="field-error">
          <template v-if="typeof fe.password === 'string'">{{ fe.password }}</template>
          <template v-else>
            <div style="margin-bottom:4px;">Password must include:</div>
            <ul style="padding-left:16px; display:flex; flex-direction:column; gap:3px;">
              <li v-for="msg in fe.password" :key="msg">{{ msg }}</li>
            </ul>
          </template>
        </div>

        <template v-if="authMode==='register'">
          <div class="field-label">Confirm Password</div>
          <input class="field-input" :class="{err: fe.confirm}" type="password" placeholder="Confirm password" v-model="authForm.confirm"/>
          <div v-if="fe.confirm" class="field-error">{{ fe.confirm }}</div>
        </template>

        <button class="btn-primary" :disabled="authLoading" @click="submitAuth">
          <span v-if="authLoading" class="spinner" style="width:16px;height:16px;border-width:2px;"></span>
          <span>{{ authMode === 'login' ? 'Sign In' : 'Create Account' }}</span>
        </button>
      </div>
    </div>
  </template>

  <!-- ═══════ APP SHELL ═══════ -->
  <template v-else>
    <div class="app-shell">

      <aside class="sidebar">
        <div class="sidebar-brand">That's My <span>Naga</span></div>
        <ul class="nav-list">
          <li class="nav-item" :class="{active: page==='home'}"        @click="navigate('home')">        <span class="nav-icon">⌂</span> Home </li>
          <li class="nav-item" :class="{active: page==='restaurants'}" @click="navigate('restaurants')"> <span class="nav-icon">🍽</span> Restaurants </li>
          <li class="nav-item" :class="{active: page==='cafes'}"       @click="navigate('cafes')">       <span class="nav-icon">☕</span> Cafes </li>
          <li class="nav-item" :class="{active: page==='shops'}"      @click="navigate('shops')">      <span class="nav-icon">🛍</span> Shops </li>
          <li class="nav-item" :class="{active: page==='attractions'}" @click="navigate('attractions')"> <span class="nav-icon">🗺</span> Attractions </li>
          <li class="nav-item" :class="{active: page==='allplaces'}"   @click="navigate('allplaces')">   <span class="nav-icon">📍</span> All Places </li>
          <li class="nav-item" :class="{active: page==='favorites'}"   @click="navigate('favorites')">   <span class="nav-icon">♥</span> My Favorites </li>
          <li class="nav-item" :class="{active: page==='add'}"         @click="navigate('add')">         <span class="nav-icon">＋</span> Add Recommendation </li>
          <li class="nav-item" v-if="isAdmin" @click="openAdminPanel">
            <span class="nav-icon">⚙</span> Admin Panel
          </li>
        </ul>
        <div class="sidebar-footer">
          <div style="padding: 0 22px 8px; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--border); margin-bottom: 8px;">
            {{ currentUser?.name || currentUser?.username || 'User' }}
          </div>
          <div class="sidebar-credit">
            <strong>Jerome G. Flores</strong>
          </div>
          <div class="nav-item" @click="logout"><span class="nav-icon">⎋</span> Sign Out</div>
        </div>
      </aside>

      <div class="main-area">
        <div class="topbar">
          <div class="topbar-title">{{ pageTitle }}</div>

          <div class="search-box">
            <span class="search-icon">⌕</span>
            <input type="text" placeholder="Search places..." v-model="searchQuery" @input="onSearch"/>
          </div>

          <!-- Notifications -->
          <div class="notif-bell" @click="toggleNotifDropdown" v-click-outside="closeNotifDropdown">
            🔔
            <div v-if="unreadCount > 0" class="notif-badge">{{ unreadCount > 9 ? '9+' : unreadCount }}</div>

            <div v-if="showNotifDropdown" class="notif-dropdown">
              <div class="notif-header">
                <span class="notif-header-title">Notifications</span>
                <span class="notif-mark-all" @click.stop="markAllRead">Mark all read</span>
              </div>
              <div class="notif-list">
                <div v-if="!notifications.length" class="notif-empty">No notifications yet</div>
                <div v-for="n in notifications" :key="n.id" 
                     class="notif-item" :class="{unread: !n.is_read}"
                     @click.stop="handleNotifClick(n)">
                  <div v-if="!n.is_read" class="notif-dot"></div>
                  <div class="notif-content">
                    <div class="notif-text">{{ n.message }}</div>
                    <div class="notif-time">{{ formatDate(n.created_at) }}</div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- User Menu -->
          <div class="user-menu" v-click-outside="closeUserDropdown">
            <div class="user-trigger" @click="toggleUserDropdown">
              <div class="user-avatar">{{ (currentUser?.name || currentUser?.username || 'U').charAt(0).toUpperCase() }}</div>
              <span class="user-name">{{ currentUser?.name || currentUser?.username }}</span>
              <span style="color:var(--muted);font-size:11px;">▼</span>
            </div>
            <div v-if="showUserDropdown" class="user-dropdown">
              <div class="user-dropdown-item" @click="viewProfile(currentUser.id)">
                <span>👤</span> My Profile
              </div>
              <div class="user-dropdown-item" @click="navigate('settings')">
                <span>⚙</span> Settings
              </div>
              <div class="user-dropdown-divider"></div>
              <div class="user-dropdown-item" @click="logout">
                <span>⎋</span> Sign Out
              </div>
            </div>
          </div>
        </div>

        <div class="page-content">
          <transition name="fade" mode="out-in">

            <!-- HOME -->
            <div v-if="page==='home'" key="home">
              <div class="featured-banner">
                <template v-if="loadingFeatured">
                  <div class="featured-content"><div class="spinner"></div></div>
                </template>
                <template v-else-if="featured">
                  <img v-if="featured.image_url" class="featured-cover" :src="resolveImg(featured.image_url)" :alt="featured.name"/>
                  <div class="featured-content">
                    <div class="featured-tag">✦ Featured Store</div>
                    <div class="featured-name">{{ featured.name }}</div>
                    <div class="featured-sub">{{ featured.category }} · {{ featured.location }}</div>
                  </div>
                </template>
                <template v-else>
                  <div class="featured-content">
                    <div class="featured-tag">✦ Featured Store</div>
                    <div class="featured-name" style="color:var(--muted);">No featured store</div>
                  </div>
                </template>
              </div>

              <div class="section-label">Top Recommended</div>
              <store-list :stores="topStores" :loading="loadingTop" :error="errorTop" @select="openStore" @retry="fetchTopStores" @toggle-fav="toggleFavorite"></store-list>

              <div class="section-label" style="margin-top: 24px;">Recommendations</div>
              <div v-if="loadingRecs" class="state-box"><div class="spinner"></div></div>
              <div v-else-if="errorRecs" class="state-box">
                <div class="state-icon">⚠</div>
                <div class="state-title">Failed to load</div>
                <button class="btn-retry" @click="fetchRecommendations">Retry</button>
              </div>
              <div v-else-if="!recommendations.length" class="state-box">
                <div class="state-icon">🔍</div>
                <div class="state-title">No recommendations yet</div>
              </div>
              <div v-else class="rec-grid">
                <div class="rec-card" v-for="r in recommendations" :key="r.id">
                  <div class="rec-img">
                    <img v-if="r.image_url" :src="resolveImg(r.image_url)" :alt="r.title"/>
                    <span v-else class="store-img-ph">🏪</span>
                  </div>
                  <div class="rec-info">
                    <div class="rec-name">{{ r.title }}</div>
                    <div class="rec-meta">{{ r.category }} · {{ r.location }} · by <span class="review-author" @click.stop="viewProfile(r.user_id)">{{ r.author || 'unknown' }}</span></div>
                    <div class="rec-reason"><strong>Reason:</strong> {{ r.reason }}</div>
                    <div class="rec-detail">Hours: {{ r.hours || 'N/A' }} | Contact: {{ r.contact || 'N/A' }}</div>
                    <div class="rec-actions" v-if="canEdit(r)">
                      <button class="btn-sm btn-edit" @click="editRec(r)">✎ Edit</button>
                      <button class="btn-sm btn-delete" @click="deleteRec(r.id)">🗑 Delete</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- RESTAURANTS -->
            <div v-else-if="page==='restaurants'" key="restaurants">
              <div class="page-heading">Restaurants</div>
              <div class="filter-bar">
                <select class="filter-select" v-model="filterMinRating" @change="applyFilters">
                  <option value="0">Any Rating</option>
                  <option value="3">3+ Stars</option>
                  <option value="4">4+ Stars</option>
                  <option value="4.5">4.5+ Stars</option>
                </select>
                <button class="sort-btn" :class="{active: sortBy==='rating_desc'}" @click="setSort('rating_desc')">Highest Rated</button>
                <button class="sort-btn" :class="{active: sortBy==='rating_asc'}" @click="setSort('rating_asc')">Lowest Rated</button>
                <button class="sort-btn" :class="{active: sortBy==='name'}" @click="setSort('name')">Name A-Z</button>
                <button class="sort-btn" :class="{active: sortBy==='newest'}" @click="setSort('newest')">Newest</button>
              </div>
              <store-list :stores="filteredListData" :loading="loadingList" :error="errorList" @select="openStore" @retry="() => fetchList('restaurant')" @toggle-fav="toggleFavorite"></store-list>
            </div>

            <!-- CAFES -->
            <div v-else-if="page==='cafes'" key="cafes">
              <div class="page-heading">Cafes</div>
              <div class="filter-bar">
                <select class="filter-select" v-model="filterMinRating" @change="applyFilters">
                  <option value="0">Any Rating</option>
                  <option value="3">3+ Stars</option>
                  <option value="4">4+ Stars</option>
                  <option value="4.5">4.5+ Stars</option>
                </select>
                <button class="sort-btn" :class="{active: sortBy==='rating_desc'}" @click="setSort('rating_desc')">Highest Rated</button>
                <button class="sort-btn" :class="{active: sortBy==='rating_asc'}" @click="setSort('rating_asc')">Lowest Rated</button>
                <button class="sort-btn" :class="{active: sortBy==='name'}" @click="setSort('name')">Name A-Z</button>
                <button class="sort-btn" :class="{active: sortBy==='newest'}" @click="setSort('newest')">Newest</button>
              </div>
              <store-list :stores="filteredListData" :loading="loadingList" :error="errorList" @select="openStore" @retry="() => fetchList('cafe')" @toggle-fav="toggleFavorite"></store-list>
            </div>

            <!-- SHOPS -->
            <div v-else-if="page==='shops'" key="shops">
              <div class="page-heading">Shops</div>
              <div class="filter-bar">
                <select class="filter-select" v-model="filterMinRating" @change="applyFilters">
                  <option value="0">Any Rating</option>
                  <option value="3">3+ Stars</option>
                  <option value="4">4+ Stars</option>
                  <option value="4.5">4.5+ Stars</option>
                </select>
                <button class="sort-btn" :class="{active: sortBy==='rating_desc'}" @click="setSort('rating_desc')">Highest Rated</button>
                <button class="sort-btn" :class="{active: sortBy==='rating_asc'}" @click="setSort('rating_asc')">Lowest Rated</button>
                <button class="sort-btn" :class="{active: sortBy==='name'}" @click="setSort('name')">Name A-Z</button>
                <button class="sort-btn" :class="{active: sortBy==='newest'}" @click="setSort('newest')">Newest</button>
              </div>
              <store-list :stores="filteredListData" :loading="loadingList" :error="errorList" @select="openStore" @retry="() => fetchList('shop')" @toggle-fav="toggleFavorite"></store-list>
            </div>

            <!-- ATTRACTIONS -->
            <div v-else-if="page==='attractions'" key="attractions">
              <div class="page-heading">Attractions</div>
              <div class="filter-bar">
                <select class="filter-select" v-model="filterMinRating" @change="applyFilters">
                  <option value="0">Any Rating</option>
                  <option value="3">3+ Stars</option>
                  <option value="4">4+ Stars</option>
                  <option value="4.5">4.5+ Stars</option>
                </select>
                <button class="sort-btn" :class="{active: sortBy==='rating_desc'}" @click="setSort('rating_desc')">Highest Rated</button>
                <button class="sort-btn" :class="{active: sortBy==='rating_asc'}" @click="setSort('rating_asc')">Lowest Rated</button>
                <button class="sort-btn" :class="{active: sortBy==='name'}" @click="setSort('name')">Name A-Z</button>
                <button class="sort-btn" :class="{active: sortBy==='newest'}" @click="setSort('newest')">Newest</button>
              </div>
              <store-list :stores="filteredListData" :loading="loadingList" :error="errorList" @select="openStore" @retry="() => fetchList('attraction')" @toggle-fav="toggleFavorite"></store-list>
            </div>

            <!-- ALL PLACES -->
            <div v-else-if="page==='allplaces'" key="allplaces">
              <div class="page-heading">All Places</div>

<script>
const API = (() => {
  const BASE_URL = 'https://wonder-naga-project.onrender.com/api';
  let token = localStorage.getItem('token') || null;
  let user = null;

  const savedUser = localStorage.getItem('user');
  if (savedUser) {
    try { user = JSON.parse(savedUser); } catch(e) { user = null; }
  }

  const setToken   = t  => { token = t; if (t) localStorage.setItem('token', t); else localStorage.removeItem('token'); };
  const setUser    = u  => { user = u; if (u) localStorage.setItem('user', JSON.stringify(u)); else localStorage.removeItem('user'); };
  const getUser    = () => user;
  const clearToken = () => { token = null; user = null; localStorage.removeItem('token'); localStorage.removeItem('user'); };

  async function req(method, path, body = null) {
    const headers = {};
    // Only set Content-Type for methods that actually send a body
    if (body || (method !== 'GET' && method !== 'DELETE' && method !== 'HEAD')) {
      headers['Content-Type'] = 'application/json';
    }
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const opts = { method, headers, credentials: 'include' };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(`${BASE_URL}${path}`, opts);
    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      throw new Error(e.message || `HTTP ${res.status}`);
    }
    return res.json();
  }

  async function upload(path, formData) {
    const headers = {};
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch(`${BASE_URL}${path}`, { method: 'POST', headers, body: formData, credentials: 'include' });
    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      throw new Error(e.message || `HTTP ${res.status}`);
    }
    return res.json();
  }

  return {
    setToken, setUser, getUser, clearToken,
    login:    body => req('POST', '/auth/login',    body),
    register: body => req('POST', '/auth/register', body),
    logout:   ()   => req('POST', '/auth/logout'),
    getFeatured:  ()           => req('GET', '/stores/featured'),
    getTopStores: ()           => req('GET', '/stores/top'),
    getStores:    (cat, q='', minRating=0, sortBy='') => req('GET', `/stores?category=${cat}&search=${encodeURIComponent(q)}&min_rating=${minRating}&sort_by=${sortBy}`),
    getStore:     id           => req('GET', `/stores/${id}`),
    getAllPlaces: ()           => req('GET', '/stores/all'),
    getRecommendations: ()     => req('GET', '/recommendations'),
    addRecommendation: fd => upload('/recommendations', fd),
    updateRecommendation: (id, fd) => upload(`/recommendations/${id}`, fd),
    deleteRecommendation: id => req('DELETE', `/recommendations/${id}`),
    getAdminStats: ()          => req('GET', '/admin/stats'),
    getAdminUsers: ()          => req('GET', '/admin/users'),
    getAdminStores: ()         => req('GET', '/admin/stores'),
    promoteUser: id           => req('POST', `/admin/users/${id}/promote`),
    deleteUser: id            => req('DELETE', `/admin/users/${id}`),
    getCategories: ()         => req('GET', '/categories'),
    getReviews: (id)          => req('GET', `/reviews/${id}`),
    addReview: (body)         => req('POST', '/reviews', body),
    updateReview: (id, body)  => req('PUT', `/reviews/${id}`, body),
    deleteReview: (id)        => req('DELETE', `/reviews/${id}`),
    // New endpoints
    getFavorites: ()          => req('GET', '/favorites'),
    addFavorite: (id)        => req('POST', '/favorites', { recommendation_id: id }),
    removeFavorite: (id)      => req('DELETE', `/favorites/${id}`),
    checkFavorite: (id)       => req('GET', `/favorites/check/${id}`),
    getProfile: (id)         => req('GET', `/users/${id}/profile`),
    getMyProfile: ()          => req('GET', '/users/me'),
    updateProfile: (fd)       => upload('/users/me', fd),
    getNotifications: ()       => req('GET', '/notifications'),
    getUnreadCount: ()         => req('GET', '/notifications/unread-count'),
    markNotifRead: (id)       => req('POST', `/notifications/${id}/read`),
    markAllRead: ()           => req('POST', '/notifications/read-all'),
  };
})();

const { createApp, ref, computed, onMounted, nextTick } = Vue;

const StoreList = {
  template: '#store-list-tpl',
  props: {
    stores:  { type: Array,   default: () => [] },
    loading: { type: Boolean, default: false },
    error:   { type: String,  default: null },
  },
  emits: ['select', 'retry', 'toggle-fav'],
  setup(props, { emit }) {
    const resolveImg = (url) => {
      if (!url) return '';
      if (url.startsWith('data:') || url.startsWith('http')) return url;
      return 'data:image/jpeg;base64,' + url;
    };
    // Get favorites from parent via a global ref or localStorage
    const isFav = (id) => {
      const favs = JSON.parse(localStorage.getItem('favorites') || '[]');
      return favs.includes(id);
    };
    return { resolveImg, isFav };
  }
};

// Click outside directive
const vClickOutside = {
  mounted(el, binding) {
    el._clickOutside = (e) => { if (!el.contains(e.target)) binding.value(); };
    document.addEventListener('click', el._clickOutside);
  },
  unmounted(el) {
    document.removeEventListener('click', el._clickOutside);
  }
};

  directives: { 'click-outside': vClickOutside },

    // ── RESTORE SESSION ──
    const savedToken = localStorage.getItem('token');
    const savedUser  = localStorage.getItem('user');
    if (savedToken && savedUser) {
      try {
        const parsed = JSON.parse(savedUser);
        currentUser.value = parsed;
        loggedIn.value = true;
        API.setToken(savedToken);
        API.setUser(parsed);
      } catch(e) {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
      }
    }

    function switchAuth(mode) { authMode.value = mode; authError.value = null; fe.value = {}; }

    function validateAuth() {
      const e = {};
      if (authMode.value === 'register' && !authForm.value.name.trim()) e.name = 'Full name is required.';
      if (!authForm.value.username.trim())  e.username = 'Username is required.';
      if (!authForm.value.password) {
        e.password = ['Password is required.'];
      } else {
        const p = authForm.value.password;
        const errs = [];
        if (p.length < 8 || p.length > 12) errs.push('8–12 characters long');
        if (!/[A-Z]/.test(p))              errs.push('at least one uppercase letter');
        if (!/[a-z]/.test(p))              errs.push('at least one lowercase letter');
        if (!/[0-9]/.test(p))              errs.push('at least one number');
        if (!/[^A-Za-z0-9]/.test(p))       errs.push('at least one symbol (e.g. @, #, !)');
        if (errs.length) e.password = errs;
      }
      if (authMode.value === 'register' && authForm.value.password !== authForm.value.confirm)
        e.confirm = 'Passwords do not match.';
      fe.value = e;
      return !Object.keys(e).length;
    }

    async function submitAuth() {
      authError.value = null;
      if (!validateAuth()) return;
      authLoading.value = true;
      try {
        const payload = { username: authForm.value.username, password: authForm.value.password };
        if (authMode.value === 'register') payload.name = authForm.value.name;
        const data = await (authMode.value === 'login' ? API.login(payload) : API.register(payload));

        loggedIn.value = true;

      if (sortBy.value === 'rating_desc') {
        data.sort((a, b) => (b.avg_rating || 0) - (a.avg_rating || 0));

      const container = document.getElementById('map-container');

      // Use a default coordinate for Naga City, Philippines if geocoding fails

      mapInstance = L.map('map-container').setView(nagaCoords, 15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19,
